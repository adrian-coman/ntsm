[tool.setuptools.packages.find]
where = ["src"]
include = ["ntsm*"]

[project]
name = "ntsm"
description = "GIS Custom Modules package"
readme = "README.rst"
requires-python = ">=3.10"
keywords = ["ntsm", "ntm", "nts"]
license = { file = "LICENSE" }
authors = [{ name = "Adrian Coman", email = "adrian.coman@proton.me" }]

classifiers = [
  'Development Status :: 4 - Beta',
  'Intended Audience :: Developers',
  'License :: OSI Approved :: MIT License',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3.10',
  'Topic :: Software Development :: Build Tools',
]

dependencies = [
  "cryptography>=41.0.0",
  "msal>=1.20.0",
  "requests>=2.28.0",
  "loguru>=0.7.0",
]

dynamic = ["version"]


[tool.setuptools.dynamic]
version = { file = "VERSION" }

[project.urls]
Homepage = "https://github.com/adrian-coman/ntsm"
Issues = "https://github.com/adrian-coman/ntsm/issues"
Documentation = "https://ntsm.readthedocs.io/en/latest/"

[project.scripts]
ntsmdocs = "ntsm._docs:_read"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
